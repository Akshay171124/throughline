[project]
name = "throughline"
version = "0.1.0"
description = "A readiness agent for conferences, built on a FalkorDB knowledge graph."
requires-python = ">=3.12"
dependencies = [
    "falkordb>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "openai>=1.50",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
